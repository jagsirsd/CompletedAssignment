version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      scylla-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      SPRING_CASSANDRA_CONTACT_POINTS: scylla
      SPRING_CASSANDRA_PORT: 9042
      SPRING_CASSANDRA_LOCAL_DATACENTER: datacenter1
      SPRING_CASSANDRA_KEYSPACE_NAME: demo
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    restart: on-failure

  # ScyllaDB: single-node dev config (--smp/--memory/--overprovisioned keep it light
  # enough to run alongside everything else on a dev machine; drop them for anything
  # resembling a real workload).
  scylla:
    image: scylladb/scylla:5.4
    command: ["--smp", "1", "--memory", "750M", "--overprovisioned", "1", "--api-address", "0.0.0.0"]
    ports:
      - "9042:9042"
    volumes:
      - scylla_data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  # One-shot: creates the keyspace/table before `app` starts. Spring Boot's Cassandra
  # auto-configuration builds its session with a fixed keyspace at startup and doesn't
  # create keyspaces itself (unlike JPA's ddl-auto), so the keyspace must already exist.
  scylla-init:
    image: scylladb/scylla:5.4
    depends_on:
      scylla:
        condition: service_healthy
    entrypoint: ["cqlsh", "scylla", "-e",
      "CREATE KEYSPACE IF NOT EXISTS demo WITH replication = {'class':'SimpleStrategy','replication_factor':1}; CREATE TABLE IF NOT EXISTS demo.items (id bigint PRIMARY KEY, name text, description text);"]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      # Host 9091 -> container 9090: host 9090 is reserved for the app's gRPC port.
      # Grafana reaches Prometheus over the internal docker network, unaffected.
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  scylla_data:
  grafana_data:
