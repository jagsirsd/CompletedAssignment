name: Build and Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: mydb
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d mydb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      kafka:
        image: apache/kafka:3.7.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
        ports:
          - 9092:9092

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/mydb
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw -s maven-settings.xml -B verify

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  # CDC end-to-end verification: starts the full infrastructure via docker compose
  # (including Debezium Kafka Connect), runs the Spring Boot app on the runner, then
  # exercises the create → CDC → Redis, delete → eviction, and external-SQL-change
  # scenarios described in the project README.
  e2e:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25

    env:
      # App connects to services via host port-mappings
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/mydb
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      # Kafka PLAINTEXT_HOST listener is on 29092 in docker-compose (not 9092)
      SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:29092
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379
      # Debezium connector registration: Connect REST API is port-mapped to host
      APP_DEBEZIUM_KAFKACONNECTURL: http://localhost:8083
      APP_DEBEZIUM_TOPIC: mydb.public.items
      # Connector itself runs inside Docker and must reach Postgres via the service name
      APP_DEBEZIUM_DBHOSTNAME: db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build JAR
        run: ./mvnw -s maven-settings.xml -B package -DskipTests

      # Builds kafka-connect image (downloads Debezium connector from Maven Central)
      # then starts infrastructure. No ZooKeeper — Kafka runs in KRaft mode.
      - name: Start infrastructure
        run: docker compose up -d db redis kafka kafka-connect

      - name: Wait for Kafka Connect REST API
        run: |
          echo "Waiting for Kafka Connect (plugin download may take several minutes)..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8083/connectors > /dev/null; then
              echo "Kafka Connect is ready."
              break
            fi
            [ $i -eq 60 ] && echo "TIMEOUT: Kafka Connect never became ready" && exit 1
            echo "  [$i/60] not ready yet, sleeping 10s..."
            sleep 10
          done

      - name: Start Spring Boot application
        run: java -jar target/*.jar > app.log 2>&1 &

      - name: Wait for application health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Application is healthy."
              break
            fi
            [ $i -eq 30 ] && echo "TIMEOUT: application never became healthy" && cat app.log && exit 1
            sleep 5
          done

      # --- Prometheus smoke test: verify key metric families are exposed ---
      - name: Verify Prometheus metrics endpoint
        run: |
          METRICS=$(curl -sf http://localhost:8080/actuator/prometheus)
          for metric in db_write_duration_seconds cache_read_duration_seconds cdc_event_processing_duration_seconds db_table_rows cache_key_count; do
            if echo "$METRICS" | grep -q "^# HELP ${metric}"; then
              echo "PASS: $metric present"
            else
              echo "FAIL: $metric NOT found in /actuator/prometheus"
              exit 1
            fi
          done

      # DebeziumConnectorRegistrar registers the connector on ApplicationReadyEvent.
      # This step polls until the connector reports RUNNING state.
      - name: Wait for Debezium connector RUNNING
        run: |
          for i in $(seq 1 24); do
            STATE=$(curl -sf http://localhost:8083/connectors/items-cdc-connector/status \
              | jq -r '.connector.state' 2>/dev/null || echo "unavailable")
            echo "  [$i/24] connector.state=$STATE"
            [ "$STATE" = "RUNNING" ] && break
            [ $i -eq 24 ] && echo "TIMEOUT: connector never reached RUNNING" && exit 1
            sleep 5
          done

      # --- Verification 1: create item → CDC event → Redis cache ---
      - name: Verify create — CDC event populates Redis
        run: |
          RESPONSE=$(curl -sf -X POST http://localhost:8080/api/items \
            -H "Content-Type: application/json" \
            -d '{"name":"ci-widget","description":"cdc integration test"}')
          echo "API response: $RESPONSE"
          ITEM_ID=$(echo "$RESPONSE" | jq -r '.id')
          echo "ITEM_ID=$ITEM_ID" >> "$GITHUB_ENV"

          echo "Waiting 3s for CDC event to reach Redis..."
          sleep 3

          CACHED=$(docker compose exec -T redis redis-cli GET "item:$ITEM_ID")
          echo "redis GET item:$ITEM_ID = $CACHED"
          if [ -z "$CACHED" ]; then
            echo "FAIL: item not found in Redis after create"
            exit 1
          fi
          echo "PASS: item cached in Redis"

      # --- Verification 2: GET /api/items/{id} returns from Redis ---
      - name: Verify read — GET API returns cached item
        run: |
          RESPONSE=$(curl -sf "http://localhost:8080/api/items/$ITEM_ID")
          echo "GET /api/items/$ITEM_ID = $RESPONSE"
          if [ -z "$RESPONSE" ]; then
            echo "FAIL: API returned empty response"
            exit 1
          fi
          echo "PASS: GET returned data"

      # --- Verification 3: delete item → CDC event → Redis eviction ---
      - name: Verify delete — CDC event evicts from Redis
        run: |
          curl -sf -X DELETE "http://localhost:8080/api/items/$ITEM_ID"
          sleep 2

          CACHED=$(docker compose exec -T redis redis-cli GET "item:$ITEM_ID")
          echo "redis GET item:$ITEM_ID after delete = '$CACHED'"
          if [ -n "$CACHED" ]; then
            echo "FAIL: item still present in Redis after delete"
            exit 1
          fi
          echo "PASS: item evicted from Redis"

      # --- Verification 4: direct SQL insert captured by CDC (no app involved) ---
      - name: Verify external change — SQL insert captured by CDC
        run: |
          docker compose exec -T db \
            psql -U user mydb -c \
            "INSERT INTO items(name, description) VALUES ('ext-ci', 'direct-sql-insert')"

          echo "Waiting 3s for CDC event..."
          sleep 3

          EXT_ID=$(docker compose exec -T db \
            psql -U user mydb -t -c \
            "SELECT id FROM items WHERE name='ext-ci' LIMIT 1" | tr -d '[:space:]')
          echo "External item ID: $EXT_ID"

          CACHED=$(docker compose exec -T redis redis-cli GET "item:$EXT_ID")
          echo "redis GET item:$EXT_ID = $CACHED"
          if [ -z "$CACHED" ]; then
            echo "FAIL: external SQL insert was not captured by CDC"
            exit 1
          fi
          echo "PASS: external SQL change captured by CDC and cached in Redis"

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== app.log ===" && cat app.log || true
          echo "=== kafka-connect ===" && docker compose logs --tail=100 kafka-connect || true
          echo "=== db ===" && docker compose logs --tail=50 db || true
          echo "=== kafka ===" && docker compose logs --tail=50 kafka || true

      - name: Tear down
        if: always()
        run: docker compose down -v
