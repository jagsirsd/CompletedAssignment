spring:
  application:
    name: demo

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mydb}
    username: ${SPRING_DATASOURCE_USERNAME:user}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: cdc-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

server:
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:400}
      min-spare: 20
    accept-count: 200
    max-connections: 10000
    keep-alive-timeout: 60000
    max-keep-alive-requests: -1

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9090}
    reflection-service-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        db.write.duration: true
        db.delete.duration: true
        cache.read.duration: true
        cache.write.duration: true
        cdc.event.processing.duration: true
        cdc.capture.lag.duration: true
        cdc.consume.lag.duration: true
        cdc.total.lag.duration: true
        fastpath.cache.write.duration: true
        item.command.total.duration: true
        writebehind.batch.flush.duration: true
      slo:
        db.write.duration: 1ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s
        cache.read.duration: 100us,500us,1ms,5ms,10ms,25ms

app:
  cache:
    items-ttl-seconds: 300
  debezium:
    kafka-connect-url: ${APP_DEBEZIUM_KAFKACONNECTURL:http://localhost:8083}
    topic: ${APP_DEBEZIUM_TOPIC:mydb.public.items}
    db-hostname: ${APP_DEBEZIUM_DBHOSTNAME:}
  metrics:
    # How often (ms) the scheduled gauge collector samples DB row count + Redis key count
    collection-interval-ms: ${APP_METRICS_INTERVAL_MS:5000}
