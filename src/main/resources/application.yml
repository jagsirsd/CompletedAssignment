spring:
  application:
    name: demo

  cassandra:
    contact-points: ${SPRING_CASSANDRA_CONTACT_POINTS:localhost}
    port: ${SPRING_CASSANDRA_PORT:9042}
    local-datacenter: ${SPRING_CASSANDRA_LOCAL_DATACENTER:datacenter1}
    keyspace-name: ${SPRING_CASSANDRA_KEYSPACE_NAME:demo}
    # Table is created by docker-compose's scylla-init service; nothing to manage here.
    schema-action: none

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

server:
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:400}
      min-spare: 20
    accept-count: 200
    max-connections: 10000
    keep-alive-timeout: 60000
    max-keep-alive-requests: -1

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9090}
    reflection-service-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        db.write.duration: true
        db.delete.duration: true
        cache.read.duration: true
        cache.write.duration: true
        fastpath.cache.write.duration: true
        item.command.total.duration: true
      slo:
        db.write.duration: 1ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s
        cache.read.duration: 100us,500us,1ms,5ms,10ms,25ms

app:
  cache:
    items-ttl-seconds: 300
  metrics:
    # How often (ms) the scheduled gauge collector samples DB row count + Redis key count
    collection-interval-ms: ${APP_METRICS_INTERVAL_MS:5000}
